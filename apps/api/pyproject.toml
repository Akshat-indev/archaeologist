[project]
name = "archaeologist-api"
version = "0.1.0"
description = "Local static-analysis API for Archaeologist"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.34,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
